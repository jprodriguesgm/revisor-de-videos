<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisor de Vídeos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%23151515' stroke='%23e8e8e8' stroke-width='2'/%3E%3Cpath d='M10 8.5v7l6-3.5z' fill='%23e8e8e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#/inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>
      <span>Revisor de Vídeos</span>
    </a>
    <nav id="steps" aria-label="Etapas"></nav>
    <div class="top-actions">
      <a class="btn ghost q-chip hidden" id="queue-chip" href="#/analise" title="Ver a fila de análise"><i class="q-dot" aria-hidden="true"></i><span class="lb">Fila</span></a>
      <a class="btn ghost" href="#/relatorio" title="Relatório do mês" aria-label="Relatório do mês">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-8"/></svg>Relatório do mês</a>
      <a class="btn ghost" href="#/config" title="Configurações" aria-label="Configurações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Configurações</a>
      <button class="btn ghost" id="quit-btn" type="button" title="Fechar o Revisor de Vídeos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>Sair</button>
    </div>
  </header>
  <main id="screen" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/ui/revisao.js"></script>
<script src="/ui/final.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
