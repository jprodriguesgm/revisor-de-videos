# Monta o Revisor de Vídeos para Mac (Apple Silicon) e Windows e publica em "Releases".
# Roda quando alguém aperta "Run workflow" (aba Actions) ou quando sobe uma etiqueta v1.2.3.
#   - "Versão oficial" vazia → "Montagem N (teste)", pré-lançamento (as equipes não recebem).
#   - "Versão oficial" = 1.2.3 (ou etiqueta v1.2.3) → versão oficial, entregue pelo link releases/latest.
# Não roda a cada push; FFmpeg/Tesseract/Whisper/modelo ficam no cache entre uma montagem e outra.
name: Montar o app

on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: "Montar para"
        type: choice
        options: [ambos, mac, windows]
        default: ambos
      versao:
        description: "Versão oficial (ex.: 1.0.0). Deixe vazio para uma versão de teste."
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: montar
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-24.04
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - name: Conferir a versão oficial
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          if [ -n "$VERSAO" ] && ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Versão::Use o formato 1.2.3 (só números e pontos), sem o v."
            exit 1
          fi
          if [ -n "$VERSAO" ] && [ "${{ inputs.sistemas }}" != "ambos" ]; then
            echo "::error title=Versão::Versão oficial sai sempre para Mac e Windows juntos (escolha ambos)."
            exit 1
          fi
      - id: m
        run: |
          MAC='{"os":"macos-15","nome":"mac"}'; WIN='{"os":"windows-2022","nome":"windows"}'
          case "${{ inputs.sistemas }}" in
            mac) M="[$MAC]";; windows) M="[$WIN]";; *) M="[$MAC,$WIN]";;
          esac
          echo "matriz={\"include\":$M}" >> "$GITHUB_OUTPUT"

  montar:
    needs: plano
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Programas de dentro do app (cache)
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            bin
            models
          key: deps-${{ matrix.nome }}-${{ hashFiles('packaging/build_deps.py') }}

      # Windows: Vulkan SDK para montar o whisper-cli-vulkan (falas na placa de vídeo, 22/10).
      # Só quando os programas não estão no cache.
      - name: Vulkan SDK (Windows)
        if: steps.deps.outputs.cache-hit != 'true' && matrix.nome == 'windows'
        shell: pwsh
        env:
          VULKAN_VERSION: "1.4.313.2"
        run: |
          $inst = "$env:RUNNER_TEMP\vulkansdk.exe"
          $urls = @("https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe",
                    "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe")
          $ok = $false
          foreach ($u in $urls) {
            curl.exe -fL --retry 3 -o $inst $u
            if ($LASTEXITCODE -eq 0) { $ok = $true; Write-Output "baixado: $u"; break }
          }
          if (-not $ok) { Write-Output "::error title=Vulkan SDK::não foi possível baixar"; exit 1 }
          # o instalador é um programa de janela: Start-Process -Wait espera ele terminar
          $p = Start-Process -FilePath $inst -Wait -PassThru -NoNewWindow -ArgumentList @("--root", "C:\VulkanSDK\sdk", "--accept-licenses", "--default-answer", "--confirm-command", "install")
          Write-Output "instalador terminou com código $($p.ExitCode)"
          if (-not (Test-Path C:\VulkanSDK\sdk\Bin\glslc.exe)) { Write-Output "::error title=Vulkan SDK::glslc não instalado"; exit 1 }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\sdk"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\sdk\Bin"
          Write-Output "Vulkan SDK ok"

      - name: Montar FFmpeg, Tesseract, whisper-cli e baixar o modelo
        if: steps.deps.outputs.cache-hit != 'true'
        run: python packaging/build_deps.py

      # guarda logo (mesmo que um passo depois falhe, a próxima montagem não refaz tudo)
      - name: Guardar programas no cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            bin
            models
          key: deps-${{ matrix.nome }}-${{ hashFiles('packaging/build_deps.py') }}

      - name: Conferir programas
        run: python packaging/build_deps.py check

      - name: Python do app
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.nome }}" = "windows" ]; then
            # antivírus (22/10): o "envelope" pronto do PyInstaller é o mesmo de muitos vírus; montado aqui,
            # do código-fonte, ele fica diferente e o Windows Defender desconfia bem menos
            PYINSTALLER_COMPILE_BOOTLOADER=1 python -m pip install --no-binary pyinstaller pyinstaller
          fi
          python -m pip install -r requirements.txt pyinstaller pytest

      # O pip num Mac 14 escolhe o numpy "só macOS 14+"; o Mac do trabalho pode ser mais antigo.
      - name: numpy que roda desde o macOS 11 (Mac)
        if: matrix.nome == 'mac'
        run: |
          NV=$(python -c "import numpy; print(numpy.__version__)")
          python -m pip download "numpy==$NV" --platform macosx_11_0_arm64 --only-binary=:all: --no-deps -d wheels11
          python -m pip install --force-reinstall --no-deps wheels11/numpy-*.whl
          python -c "import numpy; print('numpy', numpy.__version__, numpy.__file__)"

      # versão oficial (etiqueta v1.2.3 ou campo "Versão oficial"): o app leva esse número
      - name: Versão oficial
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        shell: bash
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          VER="${VERSAO:-${GITHUB_REF#refs/tags/v}}"
          python -c "import re,sys; p='revisor/__init__.py'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'__version__ = \".*\"', '__version__ = \"'+sys.argv[1]+'\"', s))" "$VER"
          python -c "import revisor; print('versão', revisor.__version__)"

      # se algum teste falhar, o resumo vira anotação (o log do Actions não abre no ambiente do Claude)
      - name: Testes
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE tests > pytest.txt 2>&1
          rc=$?
          tail -60 pytest.txt
          if [ $rc -ne 0 ]; then
            echo "::error title=Testes::$(grep -E '^(FAILED|ERROR)|Error:|assert |^E  ' pytest.txt | head -40 | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $rc

      - name: Montar o app (PyInstaller)
        run: pyinstaller --noconfirm packaging/revisor.spec

      - name: macOS mínimo de tudo dentro do app (Mac)
        if: matrix.nome == 'mac'
        shell: bash
        run: |
          set +e
          python packaging/check_macos_min.py "dist/Revisor de Videos.app" 11.0 > minos.txt 2>&1
          rc=$?
          cat minos.txt
          echo "::notice title=macOS mínimo::$(tr '\n' '|' < minos.txt)"
          exit $rc

      - name: Diagnóstico do app montado (Mac)
        if: matrix.nome == 'mac'
        shell: bash
        run: |
          echo "### Mac" > diag-mac.txt
          cat minos.txt >> diag-mac.txt 2>/dev/null
          sw_vers | tr '\n' ' ' >> diag-mac.txt; echo >> diag-mac.txt
          set +e
          "dist/Revisor de Videos.app/Contents/MacOS/Revisor de Videos" diagnostico > d.txt 2>&1
          rc=$?
          cat d.txt | tee -a diag-mac.txt
          codesign --verify --deep --verbose=1 "dist/Revisor de Videos.app" 2>&1 | tee -a diag-mac.txt
          du -sh "dist/Revisor de Videos.app" | tee -a diag-mac.txt
          echo "::notice title=Diagnóstico Mac (app)::$(tr '\n' '|' < diag-mac.txt)"
          exit $rc

      - name: Diagnóstico do app montado (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          echo "### Windows" > diag-windows.txt
          set +e
          "dist/Revisor de Videos/revisor-terminal.exe" diagnostico > d.txt 2>&1
          rc=$?
          cat d.txt | tee -a diag-windows.txt
          du -sh "dist/Revisor de Videos" | tee -a diag-windows.txt
          [ $rc -eq 0 ] || echo "::error title=Diagnóstico Windows::$(tr '\n' '|' < diag-windows.txt)"
          exit $rc

      # antivírus (22/10): o app do Windows não chama o PowerShell (padrão que o Defender confunde com vírus)
      - name: Sem PowerShell no app (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          if grep -rniIE "[\"'](powershell|pwsh)|encodedcommand" revisor --include=*.py; then
            echo "::error title=Antivírus::o código do app chama o PowerShell"; exit 1
          fi
          echo "sem PowerShell no app: ok" | tee -a diag-windows.txt

      - name: Teste rápido com o app montado (Mac)
        if: matrix.nome == 'mac'
        shell: bash
        run: |
          python -m pip install opencv-python-headless
          python tools/make_test_videos.py
          mkdir -p build/aulas && cp tools/testdata/aula_*.mp4 build/aulas/
          time "dist/Revisor de Videos.app/Contents/MacOS/Revisor de Videos" analisar build/aulas --cache build/cache \
            --vinheta-inicio tools/testdata/vinheta_inicio.mp4 --vinheta-final tools/testdata/vinheta_final.mp4 \
            --nome-tarja "Maria Clara Souza" --sem-fala 2>&1 | tail -2 | tee -a diag-mac.txt
          python tools/evaluate.py build/cache tools/testdata > aval.txt
          grep -vE "^\s+(OK|--)" aval.txt | grep -vE "^\s*$" | tee -a diag-mac.txt

      - name: Compactar (Mac)
        if: matrix.nome == 'mac'
        run: |
          # nome fixo: o link ".../releases/latest/download/Revisor-de-Videos-mac.zip" sempre baixa a versão oficial mais nova
          ditto -c -k --sequesterRsrc --keepParent "dist/Revisor de Videos.app" "Revisor-de-Videos-mac.zip"
          ls -la *.zip | tee -a diag-mac.txt
          echo "::notice title=Diagnóstico Mac::$(tr '\n' '|' < diag-mac.txt)"

      - name: Compactar (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Revisor de Videos" -DestinationPath "Revisor-de-Videos-windows.zip"
          Get-ChildItem *.zip | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB)) MB" } | Tee-Object -Append -FilePath diag-windows.txt
          $d = (Get-Content diag-windows.txt) -join '|'
          Write-Output "::notice title=Diagnóstico Windows::$d"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.nome }}
          path: |
            *.zip
            diag-*.txt
          retention-days: 1
          compression-level: 0

  publicar:
    needs: montar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ inputs.versao }}
        run: |
          ls -la pacotes
          # versão OFICIAL (etiqueta v1.2.3 ou campo "Versão oficial"): é a que o link "latest" entrega;
          # sem versão = TESTE (pré-lançamento, ninguém recebe sem querer)
          if [ -n "$VERSAO" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ -n "$VERSAO" ]; then TAG="v$VERSAO"; else TAG="${GITHUB_REF#refs/tags/}"; fi
            TIT="Revisor de Vídeos ${TAG#v}"; PRE="--latest"
            AVISO="Versão oficial. Mac: baixe Revisor-de-Videos-mac.zip · Windows: baixe Revisor-de-Videos-windows.zip."
          else
            TAG="montagem-${GITHUB_RUN_NUMBER}"; TIT="Montagem ${GITHUB_RUN_NUMBER} (teste)"; PRE="--prerelease"
            AVISO="Versão de TESTE, ainda não liberada para as equipes. Use a versão oficial mais recente."
          fi
          {
            echo "$AVISO"
            echo
            echo "Mac (Apple Silicon, macOS 11 ou mais novo) e Windows 10/11 (64 bits). Como baixar, instalar e usar: veja o [Guia](https://github.com/$GITHUB_REPOSITORY/blob/main/GUIA.md)."
            echo
            echo "<details><summary>Diagnóstico da montagem</summary>"
            echo
            echo '```'
            cat pacotes/diag-*.txt 2>/dev/null
            echo '```'
            echo "</details>"
          } > notas.md
          # erro vira anotação (dá para ler pela API sem abrir o log)
          if ! gh release create "$TAG" pacotes/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title "$TIT" $PRE --notes-file notas.md > saida.txt 2>&1; then
            echo "::error title=Release::$(tail -c 1500 saida.txt | tr '\n' ' ')"
            exit 1
          fi
          cat saida.txt
